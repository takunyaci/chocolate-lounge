# /var/www/qr-menu/nginx.conf içine eklenen bloklar (qr-menu-nginx konteyneri).
# Konteyner: docker-compose.yml'de /var/www/chocolateloungecoffee:/var/www/chocolateloungecoffee:ro bağlı.
server {
    listen 80;
    server_name chocolateloungecoffee.com www.chocolateloungecoffee.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://chocolateloungecoffee.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.chocolateloungecoffee.com;
    ssl_certificate /etc/letsencrypt/live/chocolateloungecoffee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chocolateloungecoffee.com/privkey.pem;
    return 301 https://chocolateloungecoffee.com$request_uri;
}

server {
    listen 443 ssl;
    server_name chocolateloungecoffee.com;
    ssl_certificate /etc/letsencrypt/live/chocolateloungecoffee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chocolateloungecoffee.com/privkey.pem;
    root /var/www/chocolateloungecoffee;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~ /\. { deny all; }
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico)$ { expires 30d; access_log off; }
    location / { try_files $uri $uri/ =404; }
}
